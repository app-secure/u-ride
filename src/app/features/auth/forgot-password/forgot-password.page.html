<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/login" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="auth-container">
    <div class="header-section">
      <h1 class="title">Recuperar Contraseña</h1>
      <p class="subtitle">
        Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un enlace para restablecer tu contraseña.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="input-group">
        <ion-item lines="none" class="custom-input">
          <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
          <ion-input
            formControlName="email"
            type="email"
            placeholder="tu.nombre@{{ domain || 'correo.com' }}"
            required
            enterkeyhint="go"
            (keyup.enter)="submit()"
          ></ion-input>
        </ion-item>
        <div class="error-msg" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Ingresa un correo electrónico válido
        </div>
      </div>

      <ion-button
        type="submit"
        expand="block"
        class="submit-btn"
        [disabled]="loading"
      >
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Enviar enlace</span>
      </ion-button>
    </form>

    <div class="footer-action">
      <p>
        ¿Recordaste tu contraseña?
        <a routerLink="/auth/login">Inicia sesión aquí</a>
      </p>
    </div>
  </div>
</ion-content>
