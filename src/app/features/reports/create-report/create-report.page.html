<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/app/trips"></ion-back-button>
    </ion-buttons>
    <ion-title>Reportar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div style="max-width: 680px; margin: 0 auto;">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Motivo del reporte</ion-card-title>
        <ion-card-subtitle>Usuario reportado: {{ reportedUid }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <ion-item>
            <ion-textarea
              label="Describe lo ocurrido"
              labelPlacement="stacked"
              formControlName="reason"
              autoGrow="true"
              placeholder="Ej: lenguaje ofensivo, incumplimiento de reglas, etc."
            ></ion-textarea>
          </ion-item>

          <!-- Vista previa de evidencia -->
          <div class="evidence-preview-container" *ngIf="evidencePreview">
            <img [src]="evidencePreview" alt="Evidencia seleccionada" />
            <ion-button fill="clear" color="danger" (click)="clearEvidence()" class="clear-btn">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>

          <!-- Botones de cámara y galería centrados -->
          <div class="evidence-actions" *ngIf="!evidencePreview">
            <ion-button fill="outline" (click)="takePhoto()" shape="round">
              <ion-icon name="camera-outline" slot="start"></ion-icon>
              Cámara
            </ion-button>
            <ion-button fill="outline" (click)="selectFromGallery()" shape="round">
              <ion-icon name="image-outline" slot="start"></ion-icon>
              Galería
            </ion-button>
          </div>
          
          <div class="loading-container" *ngIf="uploading">
            <ion-spinner name="crescent"></ion-spinner>
            <p>Subiendo evidencia...</p>
          </div>

          <ion-button type="submit" expand="block" [disabled]="saving || uploading" style="margin-top: 24px;" shape="round">
            <ion-spinner *ngIf="saving" name="dots" slot="start"></ion-spinner>
            Enviar reporte
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
