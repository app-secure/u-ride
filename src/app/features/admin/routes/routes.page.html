<ion-content class="ion-padding admin-page-content">
  <div class="admin-page fade-in-up">

    <div class="page-header">
      <div>
        <h2 class="page-title">Gestión de Rutas</h2>
        <p class="page-subtitle">Define y organiza los trayectos disponibles en el sistema</p>
      </div>
      <button class="add-btn" (click)="createRoute()">
        <ion-icon name="add-outline"></ion-icon>
        Nueva Ruta
      </button>
    </div>

    <ng-container *ngIf="routes$ | async as routes">
      <div class="empty-state" *ngIf="routes.length === 0">
        <div class="empty-icon-box">
          <ion-icon name="map-outline"></ion-icon>
        </div>
        <h4>Sin rutas</h4>
        <p>No hay rutas registradas en el sistema todavía.</p>
      </div>

      <div class="items-list" *ngIf="routes.length > 0">
        <div class="list-item-card" *ngFor="let r of routes; let i = index"
          [style.animation-delay]="i * 0.04 + 's'">
          <div class="item-content">
            <div class="item-icon">
              <ion-icon name="location-outline"></ion-icon>
            </div>
            <span class="item-text">{{ r.name }}</span>
          </div>
          <div class="item-actions">
            <button class="icon-btn edit" (click)="editRoute(r)" title="Editar">
              <ion-icon name="create-outline"></ion-icon>
            </button>
            <button class="icon-btn delete" (click)="deleteRoute(r)" title="Eliminar">
              <ion-icon name="trash-outline"></ion-icon>
            </button>
          </div>
        </div>
      </div>
    </ng-container>

  </div>
</ion-content>
