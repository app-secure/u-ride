<ion-content class="ion-padding admin-page-content">
  <div class="admin-page fade-in-up">

    <div class="page-header">
      <div>
        <h2 class="page-title">Gestión de Reglas</h2>
        <p class="page-subtitle">Administra las normas de convivencia para los viajes</p>
      </div>
      <button class="add-btn" (click)="createRule()">
        <ion-icon name="add-outline"></ion-icon>
        Nueva Regla
      </button>
    </div>

    <ng-container *ngIf="rules$ | async as rules">
      <div class="empty-state" *ngIf="rules.length === 0">
        <div class="empty-icon-box">
          <ion-icon name="list-outline"></ion-icon>
        </div>
        <h4>Sin reglas</h4>
        <p>No hay reglas configuradas actualmente.</p>
      </div>

      <div class="items-list" *ngIf="rules.length > 0">
        <div class="list-item-card" *ngFor="let r of rules; let i = index"
          [style.animation-delay]="i * 0.04 + 's'">
          <div class="item-content">
            <div class="item-icon">
              <ion-icon name="shield-outline"></ion-icon>
            </div>
            <span class="item-text">{{ r.text }}</span>
          </div>
          <div class="item-actions">
            <button class="icon-btn edit" (click)="editRule(r)" title="Editar">
              <ion-icon name="create-outline"></ion-icon>
            </button>
            <button class="icon-btn delete" (click)="deleteRule(r)" title="Eliminar">
              <ion-icon name="trash-outline"></ion-icon>
            </button>
          </div>
        </div>
      </div>
    </ng-container>

  </div>
</ion-content>
